# Publishes both games to GitHub Pages: Stack It Up! at the root, Comeback under /comeback/.
name: Publish games to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/comeback
          # Stack It Up! stays at the site root
          cp index.html _site/
          cp -r assets _site/
          # Comeback lives under /comeback/
          cp -r www/. _site/comeback/
          cp docs/privacy.html _site/comeback/privacy.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
